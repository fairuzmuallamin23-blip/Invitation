<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 350px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 18px;
    }

    .buttons {
      margin-top: 25px;
    }

    button {
      font-size: 16px;
      padding: 12px 20px;
      margin: 8px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .yes {
      background-color: #ff4d6d;
      color: white;
    }

    .also-yes {
      background-color: #ffd6e0;
      color: #ff4d6d;
    }

    .response {
      margin-top: 20px;
      font-size: 20px;
      color: #ff4d6d;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hey You 💕</h1>
    <p>So I was wondering…</p>
    <p><strong>Will you be my Valentine?</strong></p>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💖</button>
      <button class="also-yes" onclick="sayYes()">Obviously 😘</button>
    </div>

    <div class="response" id="response">
      YAY 🥰 I can’t wait 💞
    </div>
  </div>

  <script>
    function sayYes() {
      document.getElementById("response").style.display = "block";
    }
  </script>

</body>
</html>
